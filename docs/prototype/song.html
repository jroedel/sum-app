<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A song · SUM mock-up</title>
<link rel="icon" href="seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="prototype.css">
<script type="module" src="app.js"></script>
<script type="module" src="song.js"></script>
</head>
<body>
<div class="mockup-banner" role="note">
  <p>Mock-up · not the real SUM app</p>
  <label>Viewing as
    <select id="as">
      <option value="newcomer">Newcomer, no request</option>
      <option value="pending">Newcomer with a request</option>
      <option value="member">Member</option>
      <option value="mentor">Mentor (an alum)</option>
      <option value="secretary">Secretary</option>
    </select>
  </label>
</div>
<header class="topbar">
  <a class="back" href="songs.html" aria-label="Back"><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></a>
  <p class="name">Songs</p>
  <span class="avatar" aria-hidden="true"><span data-for="newcomer pending">L</span><span data-for="member">M</span><span data-for="mentor">A</span><span data-for="secretary">D</span></span>
</header>
<main class="screen">
<article class="stack song" id="song" hidden>
  <div>
    <p class="sum-eyebrow">Songs</p>
    <h1 class="screen-title" data-slot="title"></h1>
    <p class="muted" data-slot="by"></p>
  </div>
  <div class="row size">
    <span class="muted">Text size</span>
    <button class="sum-btn sum-btn--quiet small" type="button" data-size="17" aria-pressed="false">A</button>
    <button class="sum-btn sum-btn--quiet small large-a" type="button" data-size="22" aria-pressed="false">A</button>
  </div>
  <div class="verses" data-slot="verses"></div>
  <p class="muted later">Chords, recordings, video and guitar tabs come later (doc 11).</p>
</article>

<div class="sum-card stack" id="no-song" hidden>
  <p>There is no such song.</p>
  <a class="sum-btn sum-btn--quiet" href="songs.html">See the songs</a>
</div>
</main>
<nav class="sum-tabbar tabbar" aria-label="Menu">
  <img class="rail-seal" src="seal.svg" alt="">
  <a class="sum-tab" href="./"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#house"/></svg></span>Home</a>
  <a class="sum-tab" href="groups.html"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#users"/></svg></span>LGs</a>
  <a class="sum-tab" href="songs.html" aria-current="page"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#music"/></svg></span>Songs</a>
  <a class="sum-tab" href="game.html"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#grid-3x3"/></svg></span>Game</a>
  <a class="sum-tab" href="more.html"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#ellipsis"/></svg></span>More</a>
</nav>
</body>
</html>

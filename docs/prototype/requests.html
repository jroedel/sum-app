<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Requests to join · SUM mock-up</title>
<link rel="icon" href="seal.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="prototype.css">
<script type="module" src="app.js"></script>
<script type="module" src="requests.js"></script>
</head>
<body>
<div class="mockup-banner" role="note">
  <p>Mock-up · not the real SUM app</p>
  <label>Viewing as
    <select id="as">
      <option value="newcomer">Newcomer, no request</option>
      <option value="pending">Newcomer with a request</option>
      <option value="member">Member</option>
      <option value="mentor">Mentor (an alum)</option>
      <option value="secretary">Secretary</option>
    </select>
  </label>
</div>
<header class="topbar">
  <a class="back" href="groups.html" aria-label="Back"><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></a>
  <p class="name">Groups</p>
  <span class="avatar" aria-hidden="true"><span data-for="newcomer pending">L</span><span data-for="member">M</span><span data-for="mentor">A</span><span data-for="secretary">D</span></span>
</header>
<main class="screen">
<h1 class="screen-title">Requests to join</h1>
<p class="muted">Approve a man and he is in the group. There is no decline: a request nobody answers goes to the secretary after 3 days.</p>

<div class="stack" id="requests"></div>
<p class="sum-card muted" id="none" hidden>Nobody is waiting.</p>

<template id="request-row">
  <div class="sum-card stack request">
    <div class="row">
      <span class="avatar" aria-hidden="true" data-slot="initial"></span>
      <div class="grow">
        <p class="sum-event-title" data-slot="title"></p>
        <p class="muted sum-num" data-slot="meta"></p>
      </div>
      <span class="sum-chip sum-chip--overdue" data-slot="late" hidden><svg class="icon-sm" aria-hidden="true"><use href="icons.svg#triangle-alert"/></svg>3 days</span>
    </div>
    <button class="sum-btn sum-btn--primary" type="button" data-slot="approve">Approve</button>
    <p class="row" data-slot="approved" hidden><span class="sum-chip sum-chip--done"><svg class="icon-sm" aria-hidden="true"><use href="icons.svg#check"/></svg>Approved</span><span class="muted">He is in the group.</span></p>
  </div>
</template>
</main>
<nav class="sum-tabbar tabbar" aria-label="Menu">
  <img class="rail-seal" src="seal.svg" alt="">
  <a class="sum-tab" href="./"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#house"/></svg></span>Home</a>
  <a class="sum-tab" href="groups.html" aria-current="page"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#users"/></svg></span>Groups</a>
  <a class="sum-tab" href="apartment.html" data-members><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#calendar-days"/></svg></span>Apartment</a>
  <a class="sum-tab" href="game.html"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#grid-3x3"/></svg></span>Game</a>
  <a class="sum-tab" href="more.html"><span class="sum-tab-pill"><svg class="icon" aria-hidden="true"><use href="icons.svg#ellipsis"/></svg></span>More</a>
</nav>
</body>
</html>
